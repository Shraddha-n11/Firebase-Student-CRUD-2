<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title> Firebase Student CRUD 2 </title>
    <style>
        .spinner{position:fixed;
        inset:0;
        left:0;
        top:0;
        width:100%;
        height:100vh;
        background-color:rgb(255,  255, 255, .8);
        display:flex;
        justify-content:center;
        align-items:center;}
    </style>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #1e3a5f, #2563eb);
            min-height: 100vh;
        }
    </style>

<body>
    <div class="container-fluid mt-5">
        <div class="row">
            <div class="col-md-4">
                <div class="card" >
                    <div class="card-header">
                        <h3><i class="fa-solid fa-users"></i> Student Data</h3>
                        </div>
                        <div class="card-body">
                        <form class="form" id="form">
                        <div class="form-group">
                        <label for="title">Name</label>
                                 <input required class="form-control" type="text" id="name">
                                    </div>
                                    <div class="form-group">
                                <label for="Grade" >Class</label>
                                 <input required class="form-control" type="text" id="Grade">
                                    </div>
                                    <div class="form-group">
                                <label for="rating" >Contact No</label>
                                 <input required class="form-control" type="text" id="contact" maxlength="10">
                        </div>
                        <button type="submit" class="btn btn-sm btn-block btn-primary" id="SubmitBtn">Submit</button>
                        <button type="button" class="btn btn-sm btn-block btn-danger d-none" id="UpdateBtn">Update</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-6 offset-md-1">
                    <div class="card">
                        <div class="card-body">
                            <table class="table table-bordered ">
                                <thead class="table table-success">
                                    <tr>
                                        <th>Sr.no</th>
                                        <th>Name</th>
                                        <th>Class</th>
                                        <th>Contact No</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody id="data">
                                    <!-- <tr>
                                        <td>1</td>
                                        <td>Shraddha Dhavale</td>
                                        <td>12th</td>
                                        <td>9850010837</td>
                                        <td><i class="fa-solid fa-pen-to-square fa-2x text-primary align-item-center"></i>
</td>
                                        <td><i class="fa-solid fa-trash-can fa-2x text-danger align-item-center"></i>
</td>
                                    </tr> -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    <div class="spinner d-none" id="spinner">
               <div class="spinner-border" role="status">
              <span class="sr-only">Loading...</span>
              </div>
              </div>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./assets/js/app.js"></script>
